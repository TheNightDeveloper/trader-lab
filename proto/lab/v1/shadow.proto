syntax = "proto3";

package lab.v1;

import "lab/v1/common.proto";

service ShadowService {
  rpc StartShadowDeployment(StartShadowDeploymentRequest) returns (StartShadowDeploymentResponse);
  rpc StopShadowDeployment(StopShadowDeploymentRequest) returns (StopShadowDeploymentResponse);
  rpc GetShadowSnapshot(GetShadowSnapshotRequest) returns (GetShadowSnapshotResponse);
  // Record one immutable decision while the observed signal's cutoff is still open.
  rpc SetShadowUserDecision(SetShadowUserDecisionRequest) returns (SetShadowUserDecisionResponse);
}

message StartShadowDeploymentRequest {
  string symbol = 1;
  int64 rule_version_id = 2;
  bool user_track = 3;
}

message StartShadowDeploymentResponse {
  int64 deployment_id = 1;
}

message StopShadowDeploymentRequest {
  int64 deployment_id = 1;
}

message StopShadowDeploymentResponse {}

message SetShadowUserDecisionRequest {
  int64 deployment_id = 1;
  int64 observation_id = 2;
  optional bool allow = 3;
}

message SetShadowUserDecisionResponse {
  int64 decided_at_unix_ms = 1;
}

message GetShadowSnapshotRequest {
  // Zero selects the active deployment or, if none is active, the most recent one.
  int64 deployment_id = 1;
}

enum ShadowState {
  SHADOW_STATE_UNSPECIFIED = 0;
  SHADOW_STATE_ACTIVE = 1;
  SHADOW_STATE_COMPLETE = 2;
  SHADOW_STATE_STOPPED = 3;
  SHADOW_STATE_GAP = 4;
  SHADOW_STATE_BUILD_CHANGED = 5;
}

enum ShadowGate {
  SHADOW_GATE_UNSPECIFIED = 0;
  SHADOW_GATE_NO_SIGNAL = 1;
  SHADOW_GATE_PENDING = 2;
  SHADOW_GATE_ALLOW = 3;
  SHADOW_GATE_BLOCK = 4;
  SHADOW_GATE_UNAVAILABLE = 5;
}

enum ShadowUserDecision {
  SHADOW_USER_DECISION_UNSPECIFIED = 0;
  SHADOW_USER_DECISION_OPEN = 1;
  SHADOW_USER_DECISION_ALLOW = 2;
  SHADOW_USER_DECISION_SKIP = 3;
  SHADOW_USER_DECISION_UNANSWERED = 4;
}

message ShadowDeployment {
  int64 id = 1;
  string symbol = 2;
  int64 rule_version_id = 3;
  string report_id = 4;
  int64 registered_at_unix_ms = 5;
  int64 start_at_unix_ms = 6;
  int64 end_at_unix_ms = 7;
  ShadowState state = 8;
  Money capital = 9;
  Decimal fee_rate = 10;
  Decimal slippage_rate = 11;
  string fill_model = 12;
  string ai_model = 13;
  string ai_prompt_version = 14;
  string rule_content_hash = 15;
  string engine_build = 16;
  bool user_track = 17;
  Money model_input_per_million = 18;
  Money model_output_per_million = 19;
}

message ShadowObservation {
  int64 candle_closed_at_unix_ms = 1;
  int64 observed_at_unix_ms = 2;
  int64 decision_at_unix_ms = 3;
  ShadowGate gate = 4;
  Money reference_close = 5;
  int64 gate_resolved_at_unix_ms = 6;
  int64 id = 7;
  ShadowUserDecision user_decision = 8;
  int64 user_decided_at_unix_ms = 9;
  ShadowEntryEvidence baseline_entry = 10;
  ShadowEntryEvidence ai_entry = 11;
  ShadowEntryEvidence user_entry = 12;
}

// Presence identifies a policy's emitted entry. A fill may still be pending or rejected.
message ShadowEntryEvidence {
  int64 filled_at_unix_ms = 1;
}

message ShadowAttribution {
  // All deltas are this track minus baseline on the observed common prefix.
  Money net_pnl_delta = 1;
  Decimal return_delta = 2;
  int32 shared_entries = 3;
  int32 baseline_only_entries = 4;
  int32 track_only_entries = 5;
}

message ShadowPeriodResult {
  int64 from_unix_ms = 1;
  int32 sampled_hours = 2;
  Money net_pnl = 3;
}

message ShadowTrack {
  repeated Metric metrics = 1;
  int32 entries = 2;
  ShadowAttribution attribution = 3;
  repeated ShadowPeriodResult periods = 4;
}

message GetShadowSnapshotResponse {
  repeated ShadowDeployment deployments = 1;
  ShadowDeployment selected = 2;
  repeated ShadowObservation observations = 3;
  ShadowTrack baseline = 4;
  ShadowTrack ai = 5;
  int32 sampled_hours = 6;
  int64 input_tokens = 7;
  int64 output_tokens = 8;
  repeated string symbols = 9;
  bool assistant_enabled = 10;
  ShadowTrack user = 11;
  Money estimated_model_cost = 12;
  int32 model_attempts = 13;
  int32 missing_model_usage = 14;
  optional int32 minimum_closed_trades = 15;
}
