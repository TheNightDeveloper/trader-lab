syntax = "proto3";

package lab.v1;

import "lab/v1/account.proto";
import "lab/v1/common.proto";
import "lab/v1/workspace.proto";

// PaperService only operates on local, simulated spot accounts.
service PaperService {
  rpc GetPaperAccount(GetPaperAccountRequest) returns (GetPaperAccountResponse);
  rpc InitializePaperAccount(InitializePaperAccountRequest) returns (InitializePaperAccountResponse);
  rpc PreviewPaperPlan(PreviewPaperPlanRequest) returns (PreviewPaperPlanResponse);
  rpc GetPaperPlan(GetPaperPlanRequest) returns (GetPaperPlanResponse);
  rpc ConfirmPaperPlan(ConfirmPaperPlanRequest) returns (ConfirmPaperPlanResponse);
  rpc GetPaperReceipt(GetPaperReceiptRequest) returns (GetPaperReceiptResponse);
  rpc ListPaperJournal(ListPaperJournalRequest) returns (ListPaperJournalResponse);
  rpc CancelPaperEntry(CancelPaperEntryRequest) returns (CancelPaperEntryResponse);
  rpc ReducePaperPosition(ReducePaperPositionRequest) returns (ReducePaperPositionResponse);
  rpc SetPaperEntryPause(SetPaperEntryPauseRequest) returns (SetPaperEntryPauseResponse);
}

message GetPaperAccountRequest {}

message GetPaperAccountResponse {
  PaperAccount paper_account = 1; // absent until initialized
  repeated PaperReceipt recent_receipts = 2;
  repeated PaperPosition positions = 3;
  PaperReconciliation reconciliation = 4;
}

message InitializePaperAccountRequest {
  Money capital = 1;
  Money max_loss_per_trade = 2;
  Money max_open_loss = 3;
  Money max_spot_exposure = 4;
}

message InitializePaperAccountResponse {
  PaperAccount paper_account = 1;
}

message PaperAccount {
  AccountSnapshot snapshot = 1;
  Money initial_capital = 2;
  Money reserved_balance = 3;
  Money max_loss_per_trade = 4;
  Money max_open_loss = 5;
  Money max_spot_exposure = 6;
  Decimal fee_rate = 7;
  Decimal slippage_rate = 8;
  bool entries_paused = 9;
}

message PreviewPaperPlanRequest {
  AccountRef account = 1;
  int64 opportunity_id = 2;
  Money stop = 3;
  Money take_profit = 4;
}

message PreviewPaperPlanResponse {
  PaperPlan plan = 1;
  PaperRestriction restriction = 2; // set when current inputs cannot produce a plan
}

message GetPaperPlanRequest {
  string plan_hash = 1;
}

message GetPaperPlanResponse {
  PaperPlan plan = 1;
  PaperRestriction restriction = 2; // the recorded plan may no longer be usable
  PaperReceipt receipt = 3; // survives a lost confirmation response
}

message ConfirmPaperPlanRequest {
  AccountRef account = 1;
  string plan_hash = 2;
}

message ConfirmPaperPlanResponse {
  PaperReceipt receipt = 1;
  PaperRestriction restriction = 2;
}

message GetPaperReceiptRequest {
  int64 receipt_id = 1;
}

message GetPaperReceiptResponse {
  PaperReceipt receipt = 1;
  repeated PaperExecutionEvent events = 2;
  PaperReduction reduction = 3; // latest request, including a terminal outcome
}

message ListPaperJournalRequest {
  int64 before_receipt_id = 1; // exclusive, zero starts at the newest receipt
}

message ListPaperJournalResponse {
  repeated PaperJournalTrade trades = 1;
  int64 next_before_receipt_id = 2; // zero means end of history
}

message PaperJournalTrade {
  PaperReceipt receipt = 1;
  Money open_quantity = 2; // absent when no position remains
  Money fees_paid = 3;
  Money realized_pnl = 4;
}

message CancelPaperEntryRequest {
  AccountRef account = 1;
  int64 receipt_id = 2;
}

message CancelPaperEntryResponse {
  PaperReceipt receipt = 1;
}

message ReducePaperPositionRequest {
  AccountRef account = 1;
  int64 receipt_id = 2;
  int64 position_revision = 3;
  Money quantity = 4; // exact base asset amount, rounded to a lot by the caller
}

message ReducePaperPositionResponse {
  PaperReduction reduction = 1;
  PaperRestriction restriction = 2;
}

enum PaperReductionState {
  PAPER_REDUCTION_STATE_UNSPECIFIED = 0;
  PAPER_REDUCTION_STATE_PENDING = 1;
  PAPER_REDUCTION_STATE_FILLED = 2;
  PAPER_REDUCTION_STATE_SUPERSEDED = 3;
}

message PaperReduction {
  int64 id = 1;
  int64 receipt_id = 2;
  PaperReductionState state = 3;
  Money quantity = 4;
  int64 requested_at_unix_ms = 5;
  optional int64 result_event_id = 6;
}

message PaperReconciliation {
  int64 checked_at_unix_ms = 1;
  int64 last_event_id = 2;
  bool cash_matches = 3;
  bool reservations_match = 4;
  bool positions_match = 5;
  bool events_match = 6;
}

message SetPaperEntryPauseRequest {
  AccountRef account = 1;
  optional bool paused = 2;
}

message SetPaperEntryPauseResponse {
  bool paused = 1;
}

enum PaperEntryState {
  PAPER_ENTRY_STATE_UNSPECIFIED = 0;
  PAPER_ENTRY_STATE_PENDING = 1;
  PAPER_ENTRY_STATE_PARTIAL = 2;
  PAPER_ENTRY_STATE_FILLED = 3;
  PAPER_ENTRY_STATE_CANCELLED = 4;
  PAPER_ENTRY_STATE_EXPIRED = 5;
}

message PaperReceipt {
  int64 id = 1;
  AccountRef account = 2;
  string plan_hash = 3;
  string symbol = 4;
  PaperEntryState state = 5;
  Money requested_quantity = 6;
  Money filled_quantity = 7;
  Money reserved_cash = 8;
  int64 confirmed_at_unix_ms = 9;
  int64 expires_at_unix_ms = 10;
}

message PaperPosition {
  int64 receipt_id = 1;
  string symbol = 2;
  Money quantity = 3;
  Money cost_basis = 4; // includes paid entry fees
  MoneyReading market_value = 5;
  int64 revision = 6;
  Money lot = 7;
  PaperReduction pending_reduction = 8;
}

message PaperExecutionEvent {
  int64 id = 1;
  string kind = 2;
  int64 recorded_at_unix_ms = 3;
  Money quantity = 4;
  Money reference_price = 5;
  Money fill_price = 6;
  Money fee = 7;
  Money cash = 8;
  optional int64 candle_opened_at_unix_ms = 9;
  int32 candle_revision = 10;
  Money realized_pnl = 11; // present for exits, after entry and exit costs
}

message PaperRestriction {
  string code = 1;
  string detail = 2;
}

message PaperPlan {
  string plan_hash = 1;
  AccountRef account = 2;
  int64 account_revision = 3;
  RiskPolicyVersion risk_policy = 4;
  int64 opportunity_id = 5;
  InstrumentKey instrument = 6;
  int64 rule_version_id = 7;
  string report_id = 8;
  string snapshot_sha256 = 9;
  int64 quoted_at_unix_ms = 10;
  int64 expires_at_unix_ms = 11;
  Money reference_price = 12;
  Money estimated_entry = 13;
  Money max_entry_price = 14;
  Money stop = 15;
  Money take_profit = 16;
  Money quantity = 17;
  Money notional = 18;
  Money required_cash = 19;
  Money planned_loss = 20;
  Money estimated_cost = 21;
  Decimal fee_rate = 22;
  Decimal slippage_rate = 23;
  string fill_model = 24;
  int64 reference_candle_closed_at_unix_ms = 25;
  int32 reference_candle_revision = 26;
}
