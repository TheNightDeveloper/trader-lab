syntax = "proto3";

package lab.v1;

import "lab/v1/audit.proto";
import "lab/v1/common.proto";
import "lab/v1/report.proto";

// LibraryService: algorithms, their versions and lifecycle. Only a user action
// moves a version to active.
service LibraryService {
  rpc ListAlgorithms(ListAlgorithmsRequest) returns (ListAlgorithmsResponse);
  rpc SetVersionState(SetVersionStateRequest) returns (SetVersionStateResponse);
  rpc ListLifecycleEvents(ListLifecycleEventsRequest) returns (ListLifecycleEventsResponse);
  rpc ListRuleVersions(ListRuleVersionsRequest) returns (ListRuleVersionsResponse);
  rpc GetRuleVersion(GetRuleVersionRequest) returns (GetRuleVersionResponse);
  rpc SaveRuleVersion(SaveRuleVersionRequest) returns (SaveRuleVersionResponse);
  rpc ComposeRuleVersions(ComposeRuleVersionsRequest) returns (ComposeRuleVersionsResponse);
  rpc ListRuleTemplates(ListRuleTemplatesRequest) returns (ListRuleTemplatesResponse);
}

message AlgorithmVersion {
  string id = 1; // <algorithm>@v<n>
  int32 version = 2;
  string state = 3; // research | validation | forward_test | active | stopped | retired
  string content_hash = 4;
  repeated ParamSpec params = 5;
  int64 created_unix_ms = 6;
  repeated string next_states = 7;
  repeated RecipeItem recipe = 8; // learning algorithms: the recipe, for display
}

message RecipeItem {
  string key = 1;
  string value = 2;
}

message LatestReport {
  string report_id = 1;
  Decimal total_return = 2;
  int64 created_unix_ms = 3;
}

message Algorithm {
  string id = 1;
  string family = 2; // trend | mean_reversion | learning | hybrid | benchmark
  string description = 3; // Persian
  repeated AlgorithmVersion versions = 4; // newest first
  LatestReport latest_report = 5;
  string active_model = 6; // learning algorithms: the model serving the active version
  int64 lifecycle_revision = 7; // server revision for optimistic lifecycle decisions
}

message ListAlgorithmsRequest {}

message ListAlgorithmsResponse {
  repeated Algorithm algorithms = 1;
}

message SetVersionStateRequest {
  string version_id = 1;
  string state = 2;
  string note = 3;
  optional int64 expected_revision = 4; // required for mutations, including revision zero
}

message SetVersionStateResponse {}

message LifecycleEvent {
  string from_state = 1;
  string to_state = 2;
  string note = 3;
  string actor = 4; // user | system
  int64 at_unix_ms = 5;
  AuditEvent audit = 6;
}

message ListLifecycleEventsRequest {
  string version_id = 1;
  int32 page_size = 2; // positive opts in to sequence-ordered paging
  AuditCursor before = 3; // exclusive bound in the requested strategy version
}

message ListLifecycleEventsResponse {
  repeated LifecycleEvent events = 1;
  AuditCursor next_cursor = 2; // absent on the last page
}

// RuleVersionSummary describes an immutable research draft and its ancestry.
message RuleVersionSummary {
  int64 id = 1;
  string title = 2;
  string content_hash = 3;
  int64 parent_id = 4;
  int64 other_parent_id = 5;
  string template_key = 6;
  int64 created_unix_ms = 7;
}

message ListRuleVersionsRequest {
  string query = 1;
  int32 page_size = 2;
  int64 before_id = 3; // exclusive, zero starts at the newest version
}

message ListRuleVersionsResponse {
  repeated RuleVersionSummary versions = 1;
  int64 next_before_id = 2; // zero means the last page
}

message GetRuleVersionRequest {
  int64 id = 1;
}

message GetRuleVersionResponse {
  RuleVersionSummary version = 1;
  string definition_json = 2; // validated rules/v1
}

message SaveRuleVersionRequest {
  string title = 1;
  string definition_json = 2;
  int64 parent_id = 3; // zero begins a lineage
  string template_key = 4; // when set, a new lineage derives from this template
}

message SaveRuleVersionResponse {
  RuleVersionSummary version = 1;
}

message ComposeRuleVersionsRequest {
  string title = 1;
  int64 first_id = 2;
  int64 second_id = 3;
  string entry_mode = 4; // and | or
  int64 exit_owner_id = 5; // one of the two component versions
}

message ComposeRuleVersionsResponse {
  RuleVersionSummary version = 1;
}

message RuleTemplate {
  string key = 1;
  string title = 2;
  string description = 3;
  string definition_json = 4;
}

message ListRuleTemplatesRequest {}

message ListRuleTemplatesResponse {
  repeated RuleTemplate templates = 1;
}
