version: "2"

linters:
  enable:
    - depguard
  settings:
    staticcheck:
      # Default set, plus ST1018 off: Persian text legitimately uses the
      # zero-width non-joiner (U+200C) in words like "معامله‌ها".
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1018"]
    depguard:
      rules:
        # Invariant 5: the judge never imports the optimizer.
        judge-independence:
          files:
            - "**/internal/sim/**"
            - "**/internal/eval/**"
            - "**/internal/metrics/**"
          deny:
            - pkg: tradinglab/engine/internal/search
              desc: sim/eval/metrics must not import the optimizer (CLAUDE.md invariant 5)
            - pkg: tradinglab/engine/internal/loop
              desc: sim/eval/metrics must not import the optimizer (CLAUDE.md invariant 5)
            - pkg: tradinglab/engine/internal/model/train
              desc: sim/eval/metrics must not import the optimizer (CLAUDE.md invariant 5)
  exclusions:
    paths:
      - internal/gen
      - internal/store/db

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - internal/gen
      - internal/store/db
